lzc-sdk-version: "0.1"
name: Cops
package: cloud.lazycat.app.cops
version: 3.6.5
description: 📚web-based light alternative to Calibre content server
homepage: https://github.com/mikespub-org/seblucas-cops
author: mikespub-org
application:
  subdomain: cops
  background_task: true
  public_path:
    - /
  routes:
    - /=http://cops:80/
services:
  cops:
    image: registry.lazycat.cloud/czyt/linuxserver/cops:0320f0c566d9a5e4
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
    binds:
      - /lzcapp/var/config:/config
      - /lzcapp/var/books:/books
